name: 'VigilAST Supply Chain Scanner'
description: 'Statically analyzes Python source code and installation scripts for obfuscation and malicious behaviors.'
inputs:
  target:
    description: 'The target directory or remote URL to analyze.'
    required: false
    default: '.'
  reputation:
    description: 'Enable PyPI Reputation Context-Scoring'
    required: false
    default: 'false'
  ml:
    description: 'Enable Scikit-Learn Anomaly Classifier'
    required: false
    default: 'false'
  sandbox:
    description: 'Enable DAST Dynamic Execution Tracer Sandbox'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Run VigilAST Engine
      shell: bash
      run: |
        ARGS=""
        if [ "${{ inputs.reputation }}" == "true" ]; then ARGS="$ARGS --reputation"; fi
        if [ "${{ inputs.ml }}" == "true" ]; then ARGS="$ARGS --ml"; fi
        if [ "${{ inputs.sandbox }}" == "true" ]; then ARGS="$ARGS --sandbox"; fi
        python ${{ github.action_path }}/vigilast.py ${{ inputs.target }} $ARGS
